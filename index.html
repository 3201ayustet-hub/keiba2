<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>KEIBA QUIZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:wght@400;500&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="title" class="screen active">
    <div class="title-mark">KEIBA</div>
    <h1>QUIZ</h1>
    <div class="title-rule"></div>
    <button id="startBtn" class="text-button">START <span>→</span></button>
  </section>

  <section id="quiz" class="screen">
    <header class="topbar">
      <div><span class="micro">QUESTION</span><strong id="qNo">01</strong><span class="slash">/</span><span class="micro">05</span></div>
      <div class="micro" id="qType">GⅡ / GⅢ</div>
    </header>
    <main class="quiz-main">
      <div class="eyebrow" id="qEyebrow">WINNER</div>
      <h2 id="questionText"></h2>
      <div id="choices" class="choices"></div>
    </main>
    <footer class="quiz-footer">
      <div class="hint-status"><span>FINAL BOARD</span><b id="hintCount">01 / 05</b></div>
      <button id="nextBtn" class="text-button next" disabled>NEXT <span>→</span></button>
    </footer>
  </section>

  <section id="final" class="screen">
    <header class="topbar">
      <div><span class="micro">FINAL</span></div>
      <div class="micro" id="finalHint">HINT 01 / 05</div>
    </header>
    <main class="final-main">
      <div class="board-head">
        <span id="courseName">TOKYO</span>
        <span>11 R</span>
      </div>
      <div class="board-rows">
        <div class="board-row first"><span>Ⅰ</span><b id="firstHorse">????????</b></div>
        <div class="board-row"><span>Ⅱ</span><b id="secondHorse">— — — —</b></div>
        <div class="board-row"><span>Ⅲ</span><b id="thirdHorse">— — — —</b></div>
        <div class="board-row"><span>Ⅳ</span><b id="fourthHorse">— — — —</b></div>
        <div class="board-row"><span>Ⅴ</span><b id="fifthHorse">— — — —</b></div>
      </div>
      <div class="board-time"><span>TIME</span><b id="raceTime">— — —</b></div>
      <div class="answer-area">
        <label for="answerInput">YOUR ANSWER</label>
        <input id="answerInput" type="text" autocomplete="off" inputmode="text" placeholder="馬名を入力">
      </div>
    </main>
    <footer class="final-footer">
      <div class="hint-list">
        <span id="h1">01 TIME</span><span id="h2">02 4TH / 5TH</span><span id="h3">03 3RD</span><span id="h4">04 2ND</span><span id="h5">05 COURSE</span>
      </div>
      <button id="answerBtn" class="text-button next">ANSWER <span>→</span></button>
    </footer>
  </section>

  <section id="result" class="screen">
    <div class="result-content">
      <div class="micro" id="resultKicker">FINAL</div>
      <div id="resultSymbol" class="result-symbol">○</div>
      <div id="resultTitle" class="result-title">的中</div>
      <div id="resultSub" class="result-sub">BOARD READ COMPLETE</div>
      <div class="result-answer"><span>1ST</span><b id="resultHorse"></b></div>
      <button id="restartBtn" class="text-button">PLAY AGAIN <span>→</span></button>
    </div>
  </section>
</div>
<div id="toast" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
